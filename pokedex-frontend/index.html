<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>Pesquise, salve e gerencie seus Pokémon</p>
    </header>

    <main>

        <section class="busca">
            <h2>Buscar Pokémon</h2>

            <input
                type="text"
                id="pokemonBusca"
                placeholder="Digite o nome do Pokémon"
            >

            <button id="btnBuscar">
                Buscar
            </button>

            <p id="mensagem"></p>
        </section>

        <section id="resultadoPokemon" class="pokemon-card">

            <h2>Resultado</h2>

            <img id="pokemonImagem" src="" alt="">

            <h3 id="pokemonNome"></h3>

            <div class="campos-edicao">

                <label for="campoNome">Nome:</label>
                <input type="text" id="campoNome">

                <label for="campoTipo">Tipo:</label>
                <input type="text" id="campoTipo">

                <label for="campoAltura">Altura:</label>
                <input type="number" id="campoAltura" step="0.1">

                <label for="campoPeso">Peso:</label>
                <input type="number" id="campoPeso" step="0.1">

                <label for="campoImagem">Imagem:</label>
                <input type="text" id="campoImagem">

            </div>

            <button id="btnSalvar">
                💾 Salvar Pokémon
            </button>

            <button id="btnAtualizar" style="display: none;">
                ✏️ Atualizar Pokémon
            </button>

        </section>

        <section class="pokemons-salvos">

            <h2>Pokémon Salvos</h2>

            <div id="listaPokemons">
                <!-- Os Pokémon salvos aparecerão aqui -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
